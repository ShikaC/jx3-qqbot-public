name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'

      - name: Check Python syntax
        shell: pwsh
        run: |
          python -m compileall -q deploy/windows-native plugins/astrbot_plugin_jx3
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Get-ChildItem -Path deploy/windows-native -Filter *.ps1 | ForEach-Object {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errors) | Out-Null
            if ($errors -and $errors.Count -gt 0) {
              throw "$($_.Name): $($errors[0].Message)"
            }
            Write-Host "OK $($_.Name)"
          }

      - name: Install plugin test dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r plugins/astrbot_plugin_jx3/requirements.txt jinja2

      - name: Run plugin unit tests
        shell: pwsh
        working-directory: plugins/astrbot_plugin_jx3
        run: |
          python -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
